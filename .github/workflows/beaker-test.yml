name: Testing Farm Jetson E2E

on:
  # Beaker hardware is scarce; submit only when explicitly requested.
  workflow_dispatch:
    inputs:
      test_ref:
        description: GitLab ref containing /testing-farm/beaker-e2e
        required: true
        default: beaker-bootc-e2e-20261109
        type: string
      firmware:
        description: Jetson BIOS firmware branch
        required: true
        default: '39'
        type: string
      bootc_image:
        description: Tagged bootc image to install
        required: true
        default: quay.io/redhat-user-workloads/jetpack-for-rhel-tenant/rhel-102-bootc:7.2.1_6.12.0-211.72.1_110226170017
        type: string
      reservation_hours:
        description: Beaker reservation duration in hours
        required: true
        default: '6'
        type: string

permissions:
  contents: read

jobs:
  submit-testing-farm:
    name: Submit Beaker E2E to Testing Farm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Submit Testing Farm request
        id: submit
        env:
          TESTING_FARM_API_TOKEN: ${{ secrets.TESTING_FARM_API_TOKEN }}
          TESTING_FARM_REPO_URL: https://gitlab.cee.redhat.com/ggordani/qe-rhel-jetson.git
          TF_GIT_REF: ${{ inputs.test_ref }}
          JETSON_FIRMWARE: ${{ inputs.firmware }}
          BOOTC_IMAGE: ${{ inputs.bootc_image }}
          RESERVATION_HOURS: ${{ inputs.reservation_hours }}
          BEAKER_USERNAME: ${{ secrets.BEAKER_USERNAME }}
          BEAKER_PASSWORD: ${{ secrets.BEAKER_PASSWORD }}
          JETSON_SSH_KEY: ${{ secrets.JETSON_SSH_KEY }}
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
        run: python3 scripts/submit_testing_farm.py
