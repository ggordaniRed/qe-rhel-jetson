name: Update Test Matrix Dashboard

on:
  # Cron: run after the RHEL 9.8 e2e-full Prow periodic job to give it time to finish
  schedule:
    - cron: '30 10 * * 1'  # Monday 10:30 UTC (job runs 08:00)
  # Also regenerate on push to this branch when matrix scripts change
  push:
    branches: [main, rhel-9.8, rhel-9.8-latest]
    paths:
      - "matrix_data/**"
      - "scripts/generate_matrix.py"
      - "scripts/fetch_ci_data.py"
      - "scripts/fetch_device_logs.py"
      - ".github/workflows/generate-matrix.yml"
  # Regenerate after a Beaker CI run completes
  workflow_run:
    workflows: ["Beaker Jetson Testing"]
    types: [completed]
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GCS_BUCKET: test-platform-results
  GCS_PUBLIC_BUCKET: test-platform-results-public
  GCS_BASE: gs://test-platform-results/logs

jobs:
  fetch-and-generate:
    name: Fetch Results & Generate Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the branch that triggered the run. Scheduled runs execute from
          # the default branch, but the latest Jetson matrix is maintained on
          # rhel-9.8-latest, so keep scheduled dashboard generation current too.
          ref: ${{ github.event_name == 'schedule' && 'rhel-9.8-latest' || github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The dashboard, GCS fetcher, and device-log report use only Python's
      # standard library. The full hardware-test requirements are not needed
      # here and make Pages refreshes unnecessarily slow and fragile.

      #========================================================================
      # Step 1: Fetch only the RHEL 9.8 e2e-full Prow periodic job from GCS
      #========================================================================
      - name: Resolve Prow job name
        id: job
        run: |
          JOB="periodic-ci-rh-ecosystem-edge-qe-rhel-jetson-rhel-9.8-e2e-full"
          echo "name=$JOB" >> $GITHUB_OUTPUT
          echo "fetch=true" >> $GITHUB_OUTPUT
          echo "Prow job to fetch: $JOB"

      #========================================================================
      # Step 2: Fetch periodic results and generate dashboard
      #========================================================================
      - name: Fetch CI results from Prow/GCS
        run: |
          # Never allow a checked-in PR result file to become the dashboard source.
          rm -f matrix_data/ci_results.json matrix_data/device_logs.json
          python scripts/fetch_ci_data.py \
            --output matrix_data/ci_results.json \
            --include-periodic \
            --periodic-only \
            --periodic-job "${{ steps.job.outputs.name }}" \
            --periodic-limit 5
        continue-on-error: true

      - name: Fetch and summarize device logs
        if: steps.job.outputs.fetch == 'true'
        run: |
          python scripts/fetch_device_logs.py \
            --job "${{ steps.job.outputs.name }}" \
            --limit 5 \
            --output-dir docs/ci-logs \
            --index-output matrix_data/device_logs.json
        continue-on-error: true

      - name: Generate dashboard
        run: |
          python scripts/generate_matrix.py \
            --input matrix_data \
            --output docs/jetson_test_matrix.html \
            --ci-results matrix_data/ci_results.json \
            --device-log-index matrix_data/device_logs.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      #========================================================================
      # Step 3: Job summary
      #========================================================================
      - name: Job Summary
        if: always()
        run: |
          FETCH="${{ steps.job.outputs.fetch }}"
          if [ "$FETCH" == "true" ]; then
            JOB="${{ steps.job.outputs.name }}"
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📊 Prow periodic data processed

          | Field | Value |
          |-------|-------|
          | **Job** | \`${JOB}\` |
          | **Device reports** | Generated under \`docs/ci-logs/\` when archives exist |

          EOF
          fi
          echo "## 📊 Matrix dashboard regenerated" >> $GITHUB_STEP_SUMMARY

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: fetch-and-generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
