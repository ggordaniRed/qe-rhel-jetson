---
# Ansible Playbook: Install bootc on Jetson Beaker Machines
#
# Usage:
#   ansible-playbook -i inventory.yml install_bootc_v3.yml \
#     -e "registry_user='Guy Gordani'" \
#     -e "registry_pass='YOUR_TOKEN'"
#
# For a public image, skip registry authentication:
#   ansible-playbook -i inventory.yml install_bootc_v3.yml \
#     -e "registry_login_required=false"
#
# With vault for credentials:
#   ansible-playbook -i inventory.yml install_bootc.yml --ask-vault-pass
#
# Dry run:
#   ansible-playbook -i inventory.yml install_bootc.yml --check
#
# Based on: Installing bootc image on Jetson Beaker Machines - V3 (Google Doc).
# bootc is responsible for bootloader installation; this playbook does not
# inspect, reorder, or restore EFI entries.
# Link: https://docs.google.com/document/d/1dyfA2f4EQjRhe3CP-JKi8S3K54ILlBg0hXQFFEnlpao

- name: Install bootc on Jetson systems
  hosts: all
  gather_facts: true
  become: true
  
  vars:
    # Defaults for bootc_image and registry_url come from inventory.yml
    # (override with -e e.g. -e "bootc_image_tag=...")
    auto_reboot: true
    install_nvidia_toolkit: true
    registry_login_required: true
    registry_user: ""
    registry_pass: ""
  
  pre_tasks:
    - name: Load registry credentials when available
      ansible.builtin.include_vars:
        file: vars/secrets.yml
      when:
        - registry_login_required | bool
        - lookup('ansible.builtin.fileglob', playbook_dir + '/vars/secrets.yml', wantlist=True) | length > 0
      no_log: true

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - not (registry_login_required | bool) or (registry_user | length > 0 and registry_pass | length > 0)
        fail_msg: "registry_user and registry_pass are required when registry_login_required=true"
    
    - name: Display target information
      ansible.builtin.debug:
        msg: |
          Target: {{ inventory_hostname }} ({{ ansible_host }})
          Image:  {{ bootc_image }}
          OS:     {{ ansible_distribution | default('unknown') }} {{ ansible_distribution_version | default('') }}
          Arch:   {{ ansible_architecture | default('unknown') }}
  
  tasks:
    #=========================================================================
    # Step 1: Install podman
    #=========================================================================
    - name: Install podman
      ansible.builtin.dnf:
        name: podman
        state: present
      tags: [podman]

    #=========================================================================
    # Step 2: Login to container registry
    #=========================================================================
    - name: Login to container registry
      ansible.builtin.command:
        cmd: podman login --username '{{ registry_user }}' --password-stdin {{ registry_url }}
        stdin: "{{ registry_pass }}"
      no_log: true  # Don't log credentials
      changed_when: true
      when: registry_login_required | bool
      tags: [registry]
    
    #=========================================================================
    # Step 3: Pull bootc image
    #=========================================================================
    - name: Pull bootc image
      ansible.builtin.command:
        cmd: podman pull {{ bootc_image }}
      register: pull_result
      changed_when: "'Copying' in pull_result.stdout or 'Writing' in pull_result.stderr"
      tags: [image]
    
    #=========================================================================
    # Step 4: Run bootc install to-existing-root
    #=========================================================================
    - name: Run bootc install to-existing-root
      ansible.builtin.command:
        cmd: >
          podman run --rm --privileged
          -v /dev:/dev
          -v /var/lib/containers:/var/lib/containers
          -v /:/target
          --pid=host --security-opt label=type:unconfined_t
          {{ bootc_image }}
          bootc install to-existing-root
          --root-ssh-authorized-keys=/target/root/.ssh/authorized_keys
          --skip-fetch-check
      register: bootc_install
      tags: [install]
    
    - name: Display bootc install output
      ansible.builtin.debug:
        var: bootc_install.stdout_lines
      tags: [install]
    
    #=========================================================================
    # Step 5: Reboot to new image
    #=========================================================================
    - name: Reboot to bootc image
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Rebooting to bootc image"
      when: auto_reboot
      tags: [reboot]
    
    #=========================================================================
    # Step 6: Verify connection after reboot
    #=========================================================================
    - name: Wait for system to be accessible
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: auto_reboot
      tags: [verify]

    #=========================================================================
    # Step 7: Install NVIDIA Container Toolkit and configure CDI
    #=========================================================================
    - name: Add NVIDIA Container Toolkit repository
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
        dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
        mode: '0644'
      when: install_nvidia_toolkit | bool
      tags: [nvidia-toolkit]

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.command:
        cmd: dnf install -y --transient --nogpgcheck nvidia-container-toolkit
      register: nvidia_toolkit_install
      changed_when: "'Nothing to do' not in (nvidia_toolkit_install.stdout | default(''))"
      when: install_nvidia_toolkit | bool
      tags: [nvidia-toolkit]

    - name: Ensure NVIDIA CDI directory exists
      ansible.builtin.file:
        path: /etc/cdi
        state: directory
        mode: '0755'
      when: install_nvidia_toolkit | bool
      tags: [nvidia-toolkit]

    - name: Generate NVIDIA CDI configuration
      ansible.builtin.command:
        cmd: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
      when: install_nvidia_toolkit | bool
      tags: [nvidia-toolkit]

    #=========================================================================
    # Step 8: Verify deployment
    #=========================================================================
    - name: Check bootc status
      ansible.builtin.command: bootc status
      register: bootc_status
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Check rpm-ostree status
      ansible.builtin.command: rpm-ostree status
      register: rpm_ostree_status
      changed_when: false
      failed_when: false
      tags: [verify]
    
    - name: Check running kernel
      ansible.builtin.command: uname -r
      register: kernel_version
      changed_when: false
      tags: [verify]
    
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          Bootc Installation Complete!
          ========================================
          Host:   {{ inventory_hostname }}
          Kernel: {{ kernel_version.stdout }}
          Image:  {{ bootc_image }}
          ========================================
      tags: [verify]
